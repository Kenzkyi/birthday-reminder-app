<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Registry</title>
    <style>
      /* Modern reset */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        display: table; /* Using table-cell approach to ensure centering without flex */
        width: 100%;
      }

      .center-wrapper {
        display: table-cell;
        vertical-align: middle;
        text-align: center;
      }

      .card {
        background: #ffffff;
        width: 90%;
        max-width: 400px;
        padding: 40px;
        margin: 0 auto;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: left;
      }

      h2 {
        text-align: center;
        color: #4a4a4a;
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #666;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        transition: border 0.3s ease;
      }

      input:focus {
        border-color: #6a5acd;
        outline: none;
        box-shadow: 0 0 5px rgba(106, 90, 205, 0.2);
      }

      button {
        width: 100%;
        padding: 14px;
        background-color: #6a5acd;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.3s ease;
      }

      button:hover {
        background-color: #5848b3;
      }
    </style>
  </head>
  <body>
    <div class="center-wrapper">
      <div class="card">
        <h2>🎂 Birthday Registry</h2>
        <form id="form">
          <div class="form-group">
            <label for="username">Full Name</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="e.g. John Doe"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="john@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required />
          </div>

          <button type="submit">Save Birthday</button>
        </form>
      </div>
    </div>
    <script>
      // Get today's date in YYYY-MM-DD format
      const today = new Date().toISOString().split("T")[0];
      // Set the max attribute of the date input to today
      document.getElementById("dob").setAttribute("max", today);

      const form = document.getElementById("form");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const dob = document.getElementById("dob").value;
        const user = {
          username,
          email,
          dob,
        };

        fetch("/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(user),
        })
          .then((response) => response.json())
          .then((data) => {
            alert(data.message);
          })
          .catch((error) => {
            alert(error.message);
          });
      });
    </script>
  </body>
</html>
